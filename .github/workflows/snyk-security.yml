# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Runs Snyk Code (SAST) and Snyk Open Source (Go module dependencies), plus a
# Snyk Container monitor snapshot of the image on pushes to main. Snyk Code
# results are uploaded to GitHub Code Scanning. Container *testing* lives in
# snyk-container.yml.
#
# Snyk IaC is not run: the repo has no IaC files Snyk supports
# (Terraform, CloudFormation, Kubernetes, ARM, Helm).
#
# Requires a SNYK_TOKEN repository secret (https://github.com/snyk/actions#getting-your-snyk-token).
# Without it (including PRs from forks) the scans are skipped instead of failing.
#
# For more examples, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main" ]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      IMAGE: hfdownloader:snyk
    steps:
      - name: Skip if SNYK_TOKEN is not set
        if: env.SNYK_TOKEN == ''
        run: echo "::notice title=Snyk Security skipped::SNYK_TOKEN secret is not set; add it under Settings > Secrets and variables > Actions to enable these scans."

      - uses: actions/checkout@v7
        if: env.SNYK_TOKEN != ''

      # Snyk Open Source resolves Go module dependencies with the go toolchain.
      - name: Set up Go
        if: env.SNYK_TOKEN != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce

        # Snyk Code (SAST). Findings go to Code Scanning instead of failing the build.
      - name: Snyk Code test
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk code test --sarif-file-output=snyk-code.sarif

        # Snyk Open Source (SCA): records a dependency snapshot in Snyk.
        # Only on main, so PR branches don't overwrite the monitored snapshot.
      - name: Snyk Open Source monitor
        if: env.SNYK_TOKEN != '' && github.event_name == 'push'
        run: snyk monitor --all-projects

      - name: Build the Docker image
        if: env.SNYK_TOKEN != '' && github.event_name == 'push'
        run: docker build -t "$IMAGE" .

        # Snyk Container: records an image snapshot in Snyk for ongoing monitoring.
      - name: Snyk Container monitor
        if: env.SNYK_TOKEN != '' && github.event_name == 'push'
        run: snyk container monitor "$IMAGE" --file=Dockerfile

      - name: Upload result to GitHub Code Scanning
        if: env.SNYK_TOKEN != '' && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
