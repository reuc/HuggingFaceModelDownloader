# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Builds the container image from the Dockerfile and scans it for
# vulnerabilities with Snyk. Results are uploaded to GitHub Code Scanning.
#
# Requires a SNYK_TOKEN repository secret (https://github.com/snyk/actions#getting-your-snyk-token).
# Without it (including PRs from forks) the scan is skipped instead of failing.
#
# For more examples, see https://github.com/snyk/actions/

name: Snyk Container

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '35 18 15 * *' # 18:35 UTC on the 15th of each month

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      IMAGE: hfdownloader:snyk
    steps:
    - name: Skip if SNYK_TOKEN is not set
      if: env.SNYK_TOKEN == ''
      run: echo "::notice title=Snyk Container skipped::SNYK_TOKEN secret is not set; add it under Settings > Secrets and variables > Actions to enable this scan."

    - uses: actions/checkout@v7
      if: env.SNYK_TOKEN != ''

    - name: Build the Docker image
      if: env.SNYK_TOKEN != ''
      run: docker build -t "$IMAGE" .

    - name: Run Snyk to check the Docker image for vulnerabilities
      if: env.SNYK_TOKEN != ''
      # Report findings to Code Scanning rather than failing the build.
      continue-on-error: true
      uses: snyk/actions/docker@11b673cfb4b0dc0d860a1323caa199d54950dcce
      with:
        image: ${{ env.IMAGE }}
        args: --file=Dockerfile

    - name: Drop non-numeric security-severity values from the SARIF
      # Snyk writes "security-severity": "null" for issues with no CVSS score,
      # and Code Scanning rejects the whole file ("is not a number: null").
      if: env.SNYK_TOKEN != '' && hashFiles('snyk.sarif') != ''
      run: |
        jq '.runs[].tool.driver.rules |= ((. // []) | map(
              if ((.properties["security-severity"] // "") | tostring | test("^[0-9]+(\\.[0-9]+)?$"))
              then . else del(.properties["security-severity"]) end))' snyk.sarif > snyk.fixed.sarif
        mv snyk.fixed.sarif snyk.sarif

    - name: Upload result to GitHub Code Scanning
      # Snyk writes no SARIF if it errored before scanning; don't fail on top of that.
      if: env.SNYK_TOKEN != '' && hashFiles('snyk.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: snyk.sarif
        category: snyk-container
