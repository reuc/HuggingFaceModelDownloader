name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Read the version from go.mod. setup-go v6 defaults to
          # GOTOOLCHAIN=local, so a stale pin here would fail the build when
          # go.mod requires a newer toolchain.
          go-version-file: go.mod

      - name: Get version
        id: version
        run: |
          # Use git tag for filenames (e.g., v3.0.0)
          TAG="${GITHUB_REF_NAME}"
          # Strip 'v' prefix for version number in binary
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          # Build with version injected
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" \
            -o hfdownloader_${{ matrix.os }}_${{ matrix.arch }}_${{ steps.version.outputs.tag }}${{ matrix.ext }} \
            ./cmd/hfdownloader

      - name: Upload raw binary
        uses: softprops/action-gh-release@v3
        with:
          files: hfdownloader_${{ matrix.os }}_${{ matrix.arch }}_${{ steps.version.outputs.tag }}${{ matrix.ext }}

  checksums:
    name: Generate checksums
    runs-on: ubuntu-latest
    needs: build
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh release download ${{ github.ref_name }} -D release-files -R ${{ github.repository }} -p 'hfdownloader_*'

      - name: Generate checksums
        id: hash
        run: |
          cd release-files
          sha256sum hfdownloader_* > checksums.txt
          cat checksums.txt
          # sha256sum output, base64-encoded, is the subject format the SLSA generator expects.
          echo "hashes=$(base64 -w0 checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload checksums
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/checksums.txt

  # SLSA level 3 provenance for the released binaries, attached to the release
  # as an .intoto.jsonl file. Verify with https://github.com/slsa-framework/slsa-verifier.
  # The generator must be referenced by tag (not SHA) for its builder verification.
  provenance:
    name: SLSA provenance
    needs: checksums
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.checksums.outputs.hashes }}"
      provenance-name: "hfdownloader_${{ github.ref_name }}.intoto.jsonl"
      upload-assets: true
